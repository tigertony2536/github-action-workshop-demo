name: Deploy Frontend
on: push

jobs:
  lint:
    runs-on:  ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
            bun-version: 1.3.11
      - name: Install Dependencies
        run: bun i
      - name: Run ESLint
        run: bun run lint
